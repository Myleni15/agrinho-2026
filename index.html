<!DOCTYPE html>
<html lang="pt-BR">
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do Campo à Mesa Sem Desperdício</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS GERAIS E CORES (PALETA SUSTENTÁVEL) --- */
        :root {
            --verde-escuro: #2C5E3B;
            --verde-claro: #A3C9A8;
            --verde-folha: #4CAF50;
            --terracota: #D97443;
            --bege-claro: #F9F6F0;
            --texto-escuro: #2B2D42;
            --branco: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bege-claro);
            color: var(--texto-escuro);
            line-height: 1.6;
        }

        /* --- HERO HEADER (TOPO DO SITE) --- */
        header {
            background: linear-gradient(rgba(44, 94, 59, 0.85), rgba(44, 94, 59, 0.95)), 
                        url('https://images.unsplash.com/photo-1595855759920-86582396756a?auto=format&fit=crop&q=80&w=1200') no-repeat center/cover;
            color: var(--branco);
            padding: 100px 20px;
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 0% 100%);
        }

        header h1 {
            font-size: 2.8rem;
            margin
